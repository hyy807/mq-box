name: Sync upstream sing-box

# Merge the official sing-box `testing` branch into master every day.
# Private protocols live in mods/ and touch upstream code only through
# include/mods.go, constant/proxy_mods.go and two marked lines
# (include/registry.go, constant/proxy.go), so merges are normally clean.
# Success: master is pushed. Conflict or failing tests: a PR is opened instead.
on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Merge upstream
        id: merge
        run: |
          git config user.name "mq-box sync"
          git config user.email "sync@users.noreply.github.com"
          git remote add upstream https://github.com/SagerNet/sing-box.git
          git fetch upstream testing --no-tags
          if git merge-base --is-ancestor upstream/testing HEAD; then
            echo "status=uptodate" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git merge --no-edit upstream/testing; then
            echo "status=merged" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            echo "status=conflict" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify
        id: verify
        if: steps.merge.outputs.status == 'merged'
        continue-on-error: true
        run: |
          go mod tidy
          git diff --quiet go.mod go.sum || git commit -am "go mod tidy after upstream sync"
          go vet ./mods/... ./include/ ./constant/
          go test -tags with_utls,with_quic -count=1 ./mods/...
          go build -tags with_utls,with_quic,with_clash_api -o /tmp/sbox ./cmd/sing-box
          /tmp/sbox check -c mods/ci/all-protocols.json
      - name: Push master
        if: steps.merge.outputs.status == 'merged' && steps.verify.outcome == 'success'
        run: git push origin HEAD:master
      - name: Open PR on conflict or failure
        if: steps.merge.outputs.status == 'conflict' || (steps.merge.outputs.status == 'merged' && steps.verify.outcome != 'success')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="sync/upstream-$(date +%Y%m%d)"
          git checkout -B "$branch" upstream/testing
          git push -f origin "$branch"
          gh pr create --base master --head "$branch" \
            --title "Sync upstream sing-box ($(date +%F)) — needs attention" \
            --body "Automatic sync could not finish (status: ${{ steps.merge.outputs.status }}, verify: ${{ steps.verify.outcome }}). Merge upstream/testing manually; private code is under mods/." || true
