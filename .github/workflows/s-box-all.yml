name: s-box all platforms (unsigned)

# 一次构建四端：Windows / macOS / iOS / Android
# 全部不签名，产物直接作为 artifact 上传（公开仓库 Actions 免费不限量）
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Protocol tests (gate)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Private protocol tests (mods/)
        run: |
          go vet ./mods/... ./include/ ./constant/
          go test -tags with_utls,with_quic -count=1 ./mods/...
      - name: Config check of every private protocol
        run: |
          go build -tags with_utls,with_quic,with_clash_api -o /tmp/sbox ./cmd/sing-box
          /tmp/sbox check -c mods/ci/all-protocols.json

  windows-client:
    name: Windows 安装包 (x64)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag so git describe works
        shell: bash
        run: |
          git tag -f v1.15.0-alpha.10
          git describe --tags
      - name: Check out desktop client
        shell: bash
        run: |
          rm -rf clients/desktop
          git clone --depth 1 --branch dev https://github.com/SagerNet/sing-box-for-desktop.git clients/desktop
          git -C clients/desktop submodule update --init --recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: clients/desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: clients/desktop/package.json
          cache: pnpm
          cache-dependency-path: clients/desktop/pnpm-lock.yaml
      - name: Self-signed signing certificate
        shell: pwsh
        run: |
          $plain = [System.Guid]::NewGuid().ToString("N")
          $secure = ConvertTo-SecureString -String $plain -Force -AsPlainText
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=s-box CI" -CertStoreLocation Cert:\CurrentUser\My -NotAfter (Get-Date).AddYears(3)
          $pfx = Join-Path $env:RUNNER_TEMP "s-box-ci.p12"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $secure | Out-Null
          @{ windows = @{ certificateFile = $pfx; certificatePassword = $plain } } | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8NoBOM clients/desktop/signing.local.json
          Get-Content clients/desktop/signing.local.json
          Test-Path $pfx
      - name: Install dependencies
        run: pnpm -C clients/desktop install
      - name: Package NSIS installer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm -C clients/desktop package:win -- x64
      - name: Collect installer
        shell: pwsh
        run: |
          Get-ChildItem clients/desktop/release | Select-Object Name,Length | Format-Table
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item clients/desktop/release/SFW-*.exe dist
          Get-ChildItem dist | Select-Object Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: s-box-windows-installer
          path: dist

  windows:
    name: Windows CLI
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          mkdir dist -Force | Out-Null
          go build -trimpath -tags 'with_clash_api,with_quic,with_utls,with_gvisor' -o dist/s-box-windows-amd64.exe ./cmd/sing-box
          $env:GOARCH = "arm64"
          go build -trimpath -tags 'with_clash_api,with_quic,with_utls,with_gvisor' -o dist/s-box-windows-arm64.exe ./cmd/sing-box
          Compress-Archive -Path dist/* -DestinationPath s-box-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: s-box-windows
          path: s-box-windows.zip

  darwin:
    name: macOS CLI + app
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out apple client
        run: |
          rm -rf clients/apple
          git clone --filter=blob:none --no-checkout https://github.com/SagerNet/sing-box-for-apple.git clients/apple
          cd clients/apple
          git fetch --depth 1 origin e1bc3629ee78fa824176c6be157ee2be7795c5c0
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build darwin CLI
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -tags 'with_clash_api,with_quic,with_utls,with_gvisor' -o dist/s-box-darwin-amd64 ./cmd/sing-box
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -tags 'with_clash_api,with_quic,with_utls,with_gvisor' -o dist/s-box-darwin-arm64 ./cmd/sing-box
      - name: Patch apple client
        run: |
          python3 mods/ci/test_app_groups.py
          python3 mods/ci/patch_app_groups.py clients/apple
          python3 mods/ci/patch_ios15_toolbar.py clients/apple
      - name: Set up gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile
          go install github.com/sagernet/gomobile/cmd/gobind
          "$(go env GOPATH)/bin/gomobile" init
      - name: Build apple libbox
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform macos
          rm -rf clients/apple/Libbox.xcframework
          mv Libbox.xcframework clients/apple/
      - name: Archive macOS app (unsigned)
        run: |
          cd clients/apple
          xcodebuild archive \
            -project sing-box.xcodeproj \
            -scheme SFM \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/SFM.xcarchive" \
            -skipPackagePluginValidation \
            BASE_PACKAGE_IDENTIFIER=com.mQaKx.AkyLoyU \
            APP_GROUP_IDENTIFIER=group.57234YHGTV.8FK1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/SFM.xcarchive/Products/Applications/s-box.app" "$GITHUB_WORKSPACE/dist/s-box-macos-app.zip" || \
          ditto -c -k --sequesterRsrc --keepParent "$RUNNER_TEMP/SFM.xcarchive/Products/Applications/"*.app "$GITHUB_WORKSPACE/dist/s-box-macos-app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: s-box-macos
          path: dist

  ios:
    name: iOS IPA (unsigned)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Check out apple client
        run: |
          rm -rf clients/apple
          git clone --filter=blob:none --no-checkout https://github.com/SagerNet/sing-box-for-apple.git clients/apple
          cd clients/apple
          git fetch --depth 1 origin e1bc3629ee78fa824176c6be157ee2be7795c5c0
          git checkout -q FETCH_HEAD
          git submodule update --init --recursive --depth 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Patch apple client
        run: |
          python3 mods/ci/test_app_groups.py
          python3 mods/ci/patch_app_groups.py clients/apple
          python3 mods/ci/patch_ios15_toolbar.py clients/apple
      - name: Set up gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile
          go install github.com/sagernet/gomobile/cmd/gobind
          "$(go env GOPATH)/bin/gomobile" init
      - name: Build apple libbox
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target apple -platform ios
          rm -rf clients/apple/Libbox.xcframework
          mv Libbox.xcframework clients/apple/
      - name: Archive iOS app (unsigned)
        run: |
          cd clients/apple
          xcodebuild archive \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SFI.xcarchive" \
            -skipPackagePluginValidation \
            BASE_PACKAGE_IDENTIFIER=com.mQaKx.AkyLoyU \
            APP_GROUP_IDENTIFIER=group.57234YHGTV.8FK1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
      - name: Package unsigned IPA
        run: |
          set -eu
          app="$RUNNER_TEMP/SFI.xcarchive/Products/Applications/sing-box.app"
          test -d "$app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/sing-box.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qr "$GITHUB_WORKSPACE/dist/s-box-ios-unsigned.ipa" Payload)
          unzip -t dist/s-box-ios-unsigned.ipa
          /usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$app/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print MinimumOSVersion' "$app/PlugIns/Extension.appex/Info.plist"
          shasum -a 256 dist/s-box-ios-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: s-box-ios
          path: dist

  android-library:
    name: Android libbox (${{ matrix.go_arch }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        go_arch: ["arm64", "arm", "amd64"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build library
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile
          go install github.com/sagernet/gomobile/cmd/gobind
          export PATH="$PATH:$(go env GOPATH)/bin"
          go run ./cmd/internal/build_libbox -target android -platform android/${{ matrix.go_arch }}
          mkdir -p dist/${{ matrix.go_arch }}
          mv libbox.aar libbox-legacy.aar dist/${{ matrix.go_arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: libbox-android-${{ matrix.go_arch }}
          path: dist
          compression-level: 0

  android-apk:
    name: Android APK
    needs:
      - verify
      - android-library
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Check out android client
        run: |
          rm -rf clients/android
          git clone --depth 1 --branch dev https://github.com/SagerNet/sing-box-for-android.git clients/android
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/download-artifact@v4
        with:
          pattern: libbox-android-*
          path: libbox-inputs
      - name: Merge AARs into the client
        run: |
          ls -R libbox-inputs | head -20
          mkdir -p clients/android/app/libs
          go run ./cmd/internal/merge_aar -output clients/android/app/libs/libbox.aar libbox-inputs/*/*/libbox.aar
          go run ./cmd/internal/merge_aar -output clients/android/app/libs/libbox-legacy.aar libbox-inputs/*/*/libbox-legacy.aar
          ls -l clients/android/app/libs
      - name: Build unsigned APK
        working-directory: clients/android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          chmod +x gradlew
          ./gradlew --build-cache --parallel :app:assembleOtherDebug || ./gradlew --build-cache --parallel :app:assembleDebug
          mkdir -p ../../dist
          find . -name '*.apk' -path '*outputs*' -exec cp {} ../../dist/ \;
          ls -l ../../dist
      - uses: actions/upload-artifact@v4
        with:
          name: s-box-android
          path: dist
